[package]
name = "pomodoro-ui"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
console_error_panic_hook = "0.1.7"
js-sys = "0.3"
js_bindgen = { version = "0.1.0", path = "js_bindgen" }
leptos = { version = "0.7.7", features = ["csr"] }
leptos_router = "0.7.7"
reactive_stores = "0.1.7"
reactive_stores_macro = "0.1.7"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
thaw = { version = "0.4.4", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
chrono = { version = "0.4.38", features = ["serde"] }
leptos-chartistry = "0.2.1"

[workspace]
members = [ "js_bindgen","src-tauri"]

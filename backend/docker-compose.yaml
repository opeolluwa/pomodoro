services:
  app:
    build: 
      context: .
      dockerfile: Dockerfile.local
    container_name: poseidon 
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
  postgres:
    image: postgres
    restart: always
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=poseidon
      - POSTGRES_USER=poseidon
      - POSTGRES_PASSWORD=poseidon
    ports:
      - "6543:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - "8888:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: poseidon@mailer.com
      PGADMIN_DEFAULT_PASSWORD: posedion
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  pgadmin-data:


